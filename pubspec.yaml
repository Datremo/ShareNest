dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  flutter_riverpod: ^3.3.2
  google_maps_flutter: ^2.18.0
  google_fonts: ^8.2.1
  supabase_flutter: ^2.17.2
